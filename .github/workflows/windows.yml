name: windows

# Build the Windows x64 installer on demand for the synced upstream version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, as a tag and a release title
        type: string
        required: true
        default: "0.50.3"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  installer:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 40GB
      - name: put the target directory on the Dev Drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DEV_DRIVE/target" | Out-Null
          New-Item -ItemType Junction -Path target -Target "$env:DEV_DRIVE/target" | Out-Null

      - name: rust toolchain
        run: rustup toolchain install

      - name: verify the release version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $package = [regex]::Match($manifest, '(?ms)^\[workspace\.package\]\r?\n(.*?)(?=^\[|\z)').Groups[1].Value
          $expected = [regex]::Match($package, '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:VERSION -cne $expected) {
            throw "release version must match Cargo.toml ($expected)"
          }

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-pc-windows-msvc
          cache-targets: false
          cache-on-failure: true

      # Shipping releases keep the full release profile, including LTO.
      - name: build
        run: cargo build --release --locked --package sonora --target x86_64-pc-windows-msvc --timings

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: timings-x86_64-pc-windows-msvc
          path: target/cargo-timings/cargo-timing.html

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: prepare the output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # Report the compiler and its Chinese language files before building the wizard.
      - name: report the compiler
        shell: pwsh
        run: |
          $iscc = Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "ISCC $($iscc.VersionInfo.ProductVersion)"
          Get-ChildItem (Join-Path $iscc.Directory "Languages") -Filter "Chinese*.isl" |
            Select-Object -ExpandProperty Name

      - name: build the Windows installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SONORA_ARCH: x64compatible
          SONORA_SETUP: Sonora-Setup
        run: |
          $env:SONORA_VERSION = $env:VERSION
          $env:SONORA_EXE = (Resolve-Path "target/x86_64-pc-windows-msvc/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      # The updater verifies this checksum file before running a downloaded installer.
      - name: write the checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS" } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content dist/SHA256SUMS -Encoding ascii

      # The release is the one place the installer is handed out from.
      - name: publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          $tag = "windows-$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $notes = "Windows x64 build of this Sonora fork: download the installer below. It needs no administrator rights. The build is unsigned, so SmartScreen asks for 'More info -> Run anyway' the first time."
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:SHA --title $env:VERSION --notes $notes --generate-notes
          }
          gh release upload $tag dist/* --clobber --repo $env:GITHUB_REPOSITORY
